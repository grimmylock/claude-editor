<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ZONE — Solo Survival RPG</title>
<style>
    * { box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #b0b0b0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 15px; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    #game-container { display: flex; width: 100%; max-width: 1400px; gap: 15px; position: relative; height: 100%; }
    .column { flex: 1; display: flex; flex-direction: column; padding: 8px; overflow-y: auto; }
    #left-col { border-right: 1px solid #2a2a2a; max-width: 320px; }
    #right-col { border-left: 1px solid #2a2a2a; max-width: 380px; }
    #mid-col { flex: 1.6; align-items: center; }
    #view { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .stat-bar { margin-bottom: 2px; font-size: 0.85em; }
    .alert { color: #ff4444; font-weight: bold; }
    .warn { color: #ffaa00; }
    .good { color: #44ff44; }
    .gold { color: #ffd700; }
    .dim, .muted { color: #666; }
    .day { color: #8af; }
    .small { font-size: 0.75em; }
    .center { text-align: center; }
    .emission { color: #ff2222; text-shadow: 0 0 5px #ff0000; font-weight: bold; }

    .top-bar { position: absolute; top: -12px; right: 0; display: flex; gap: 6px; z-index: 10; }
    .top-bar button { background: #111; border: 1px solid #333; color: #777; cursor: pointer; font-family: inherit; font-size: 0.75em; padding: 2px 6px; }
    .top-bar button:hover { color: #fff; border-color: #888; }

    .nav-tabs { display: flex; gap: 6px; margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; width: 100%; justify-content: center; padding-bottom: 8px; flex-wrap: wrap; min-height: 8px; }
    .tab-btn { background: none; border: 1px solid #333; color: #666; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.8em; }
    .tab-btn.active { color: #fff; border-color: #888; background-color: #1a1a1a; }
    .tab-btn:hover:not(.active) { color: #aaa; }

    .btn { background-color: #141414; color: #aaa; border: 1px solid #333; padding: 7px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit; width: 92%; text-align: center; transition: 0.15s; font-size: 0.85em; }
    .btn:hover:not(:disabled) { background-color: #262626; color: #fff; border-color: #666; }
    .btn:disabled, .c-btn:disabled, .inv-btn:disabled, .stat-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn.sel { border-color: #ffd700; color: #ffd700; }

    .stat-btn { background: #111; color: #44ff44; border: 1px solid #333; cursor: pointer; font-family: inherit; font-size: 0.8em; padding: 0 6px; margin-left: 3px; }
    .inv-item { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 3px; border-bottom: 1px dashed #222; padding-bottom: 2px; font-size: 0.8em; }
    .inv-btn { background: #1a1a1a; color: #888; border: 1px solid #444; cursor: pointer; font-family: inherit; font-size: 0.75em; padding: 1px 4px; white-space: nowrap; }
    .inv-btn:hover:not(:disabled) { color: #fff; border-color: #777; }

    .log-entry { margin-bottom: 6px; opacity: 0.8; font-size: 0.82em; line-height: 1.3; }
    .log-new { opacity: 1; }
    .log-new:not(.alert):not(.warn):not(.good):not(.gold):not(.day) { color: #fff; }
    h2 { font-size: 1em; border-bottom: 1px solid #2a2a2a; padding-bottom: 3px; width: 100%; text-align: center; margin: 6px 0; color: #ddd; }
    h3 { font-size: 0.85em; border-bottom: 1px solid #222; padding-bottom: 2px; width: 100%; margin: 10px 0 4px 0; color: #888; text-transform: uppercase; }
    p { font-size: 0.85em; line-height: 1.4; width: 92%; }
    .panel { border: 1px solid #444; padding: 6px 8px; margin-bottom: 6px; width: 100%; font-size: 0.82em; line-height: 1.4; }
    .panel.gold-b { border-color: #ffd700; }
    .row { width: 100%; font-size: 0.82em; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .text-in { background: #111; color: #fff; border: 1px solid #444; font-family: inherit; padding: 5px; width: 92%; }

    .grid { background: #000; border: 1px solid #333; padding: 6px; font-size: 1.15em; line-height: 1.25; user-select: none; margin: 6px 0; }
    .grow { display: flex; }
    .cell { width: 1.35em; text-align: center; cursor: pointer; color: #3a6; }
    .cell:hover { outline: 1px solid #555; }
    .c-wall { color: #555; } .c-cover { color: #bb9; } .c-hard { color: #dd6; } .c-high { color: #8af; } .c-rubble { color: #765; }
    .c-door { color: #c8f; } .c-term { color: #0ff; } .c-anom { color: #f0f; }
    .c-player { color: #fff; font-weight: bold; } .c-human { color: #f55; font-weight: bold; } .c-mutant { color: #fa4; font-weight: bold; } .c-dim { color: #666; }
    .c-target { background: #500; } .c-smoke { background: #333; } .c-reach { background: #0b1d0b; }
    .controls { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .c-btn { background: #181818; color: #ddd; border: 1px solid #444; padding: 5px 8px; cursor: pointer; font-family: inherit; font-size: 0.8em; }
    .c-btn:hover:not(:disabled) { background-color: #333; color: #fff; }
    .c-btn.red { background: #500; } .c-btn.blue { background: #034; } .c-btn.yel { background: #330; } .c-btn.pur { background: #303; }
    .apbar { color: #00ffff; font-weight: bold; margin: 4px 0; font-size: 0.85em; text-align: center; }

    body.minimalist { background-color: #000 !important; color: #fff !important; }
    body.minimalist * { border-color: #fff !important; }
    body.minimalist .btn, body.minimalist .tab-btn, body.minimalist .c-btn, body.minimalist .inv-btn, body.minimalist .stat-btn { background-color: #000 !important; color: #fff !important; }
    body.minimalist .btn:hover, body.minimalist .tab-btn.active, body.minimalist .c-btn:hover:not(:disabled) { background-color: #fff !important; color: #000 !important; }
    body.minimalist .cell, body.minimalist .apbar { color: #fff !important; }

    @media (max-width: 900px) {
        body { height: auto; overflow: auto; padding: 8px; }
        #game-container { flex-direction: column; }
        #left-col, #right-col { max-width: none; border: none; }
        #right-col { max-height: 40vh; }
    }
</style>
</head>
<body>
<div id="game-container">
    <div class="top-bar">
        <button onclick="saveGame()">[Save]</button>

        <div id="view"></div>
    </div>
    <div class="column" id="right-col">
        <h2>Zone Chronicle</h2>
        <div id="log-content"></div>

</div>

<script>

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(weights) {
    let t = 0; for (const key in weights) t += weights[key];

    for (const key in weights) { r -= weights[key]; if (r < 0) return key; }
    return Object.keys(weights)[0];
}

    ['M249 SAW', 22, '5.56x45mm', 200, 16, 7.5, 3], ['RPD', 24, '7.62x39mm', 100, 16, 7.4, 3], ['RP-74 (PKM)', 28, '7.62x54mmR', 100, 18, 8.0, 4],
    ['PKP Pecheneg', 28, '7.62x54mmR', 100, 20, 8.5, 4, { burstJamImmune: true }], ['PKP Pecheneg Zulu', 28, '7.62x54mmR', 100, 20, 9.0, 5, { hit: 1 }],

const AMMO = { 'Standard': { price: 150, short: 'Std' }, 'Hollow Point': { price: 250, short: 'HP' }, 'Dart': { price: 400, short: 'Dart' }, 'Armor Piercing': { price: 600, short: 'AP' } };
function burstOf(wd) {
    const c = CAT[wd.cat]; if (!c.burstAp) return null;
    return { ap: wd.burstAp || c.burstAp, pen: wd.burstPen ?? c.burstPen, rounds: c.burstRounds, mult: c.burstMult };

// ===================== DATA: ARMOR & MODS (file 02) =====================
const ARMOR = {};
[ // name, phys, anom, belt, mod slots, MP, weight, tier, flags
    ['Leather Jacket', .10, .05, 1, 1, 4, 3, 1], ['Raider Jacket', .15, .10, 1, 1, 4, 5, 1], ['Heavy Trenchcoat', .15, .10, 2, 1, 4, 7, 1],

function artDesc(n) {
    const a = ARTS[n], e = [];
    if (a.carry) e.push(`${sgn(a.carry)}kg carry`); if (a.regen) e.push(`+${a.regen} HP regen/turn`);
    if (a.bleed !== undefined) e.push(a.bleed ? `bleeding ${a.bleed} HP/turn` : 'negates bleeding');
    if (a.mp) e.push(`+${a.mp} MP`); if (a.avoid) e.push(`+${a.avoid} anomaly avoidance`);
    if (a.compass) e.push('auto-pass anomaly checks'); if (a.lucifer) e.push('+1 AP, +10% Phys/Anom-DR, Max HP 75');
    if (a.bypass) e.push('bypass 30% Phys-DR, kills refund 1 AP');

function addWeapon(name, cond = 'Working') { const w = { id: S.p.nid++, name, cond, mag: 0, ammo: 'Standard', jammed: false }; S.p.weapons.push(w); return w; }

function D() {
    const p = S.p, arm = p.armor ? ARMOR[p.armor.name] : null, mods = p.armor ? p.armor.mods : [];
    const mSum = key => mods.reduce((s, m) => s + (MODS[m][key] || 0), 0);
    const beltSlots = (arm ? arm.belt : 0) + (mods.includes('Artifact Pouch') ? 1 : 0);
    const worn = p.belt.slice(0, beltSlots);
    const fam = {}; let pen = 0;
    worn.forEach(n => { const a = ARTS[n]; pen += a.pen; const f = a.fam || n; if (!fam[f] || ARTS[fam[f]].tier < a.tier) fam[f] = n; });
    if (has('Artifact Handler')) pen /= 2;
    const act = Object.values(fam).map(n => ARTS[n]);
    const aSum = key => act.reduce((s, a) => s + (a[key] || 0), 0);
    const condPen = p.armor ? ({ Damaged: .10, Broken: .25 }[p.armor.cond] || 0) : 0;
    const physRaw = (arm ? arm.phys : 0) + mSum('phys') + aSum('phys') - condPen;
    const anomRaw = (arm ? arm.anom : 0) + mSum('anom') + aSum('anomB') - condPen - pen;
    let bleedDmg = 5; act.forEach(a => { if (a.bleed !== undefined) bleedDmg = Math.min(bleedDmg, a.bleed); });
    const mp = (arm ? arm.mp : 4) + (p.rank >= 4 ? 1 : 0) + aSum('mp') + mSum('mp') + (has('Sprinter') ? 1 : 0);
    const carry = (has('Pack Mule') ? 50 : 25) + (p.backpack ? BACKPACKS[p.backpack].carry : 0) + mSum('carry') + aSum('carry');
    return {
        arm, mods, beltSlots, worn, pen, physRaw, anomRaw, phys: clamp(physRaw, 0, .75), anom: clamp(anomRaw, 0, .75), bleedDmg,
        regen: aSum('regen'), avoid: aSum('avoid'), ap: RANKS[p.rank].ap + aSum('ap'), mpBase: Math.max(1, mp), carry,
        compass: act.some(a => a.compass), bypass: aSum('bypass'), killAp: act.some(a => a.killAp), maxHp: act.some(a => a.lucifer) ? 75 : 100,

    const d0 = D(); let v = kind === 'phys' ? d0.physRaw : d0.anomRaw;
    if (kind === 'phys' && sub === 'mutant' && d0.mods.includes('Treated Mutant Hide')) v += .15;

}

    const p = S.p; let w = 0;
    for (const i in p.inv) w += (ITEMS[i] ? ITEMS[i].w : 0) * p.inv[i];
    for (const cal in p.ammo) for (const t in p.ammo[cal]) w += p.ammo[cal][t] * 0.02;
    p.weapons.forEach(x => { w += WEAPONS[x.name].weight; });
    if (p.armor) w += ARMOR[p.armor.name].weight;
    p.spareArmor.forEach(a => { w += ARMOR[a.name].weight; });
    [...p.arts, ...p.belt].forEach(n => { w += ARTS[n].legend ? .8 : .5; });
    return Math.round(w * 10) / 10;
}
function drainSurvival(h, t, r) { const p = S.p; p.hunger = Math.max(0, p.hunger - h); p.thirst = Math.max(0, p.thirst - t); p.tired = Math.max(0, p.tired - r); }

    while (p.rank < 6 && MILESTONES[p.rank + 1].every(([, f]) => f())) {
        p.rank++;
        const R = RANKS[p.rank];
        log(`PROMOTION: ${R.name}! (${MILESTONES[p.rank].map(m => m[0]).join('; ')}) — AP ${R.ap}, rank mod ${sgn(R.mod)}.`, 'gold');
        if (PERK_RANKS.includes(p.rank)) { p.pendingPerks++; log('A new perk is available.', 'gold'); }
    }
}
function selectPerk(name) { S.p.perks.push(name); S.p.pendingPerks--; log(`Perk acquired: ${name}.`, 'gold'); }

// ===================== LOG / SAVE =====================
function log(msg, cls = '') {
    const box = $('log-content'), el = document.createElement('div');
    el.className = 'log-entry log-new ' + cls; el.textContent = msg;
    box.prepend(el);
    while (box.children.length > 250) box.lastChild.remove();
}
function freshLog() { document.querySelectorAll('.log-new').forEach(x => x.classList.remove('log-new')); }
function saveGame(quiet) {
    if (mode !== 'world') { if (!quiet) log('You can only save while out of combat.', 'alert'); return; }
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); if (!quiet) log('Progress saved.'); }
    catch (e) { if (!quiet) log('Save failed: browser storage unavailable.', 'alert'); }
}
function loadGame() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { /* storage blocked */ }
    if (!raw) { log('No save file found.', 'alert'); render(); return false; }
    try {
        const data = JSON.parse(raw);
        if (data.v !== 2) throw new Error('version');
        S = data; C = null; meet = null; mode = 'world';
        tab = S.w.zone === 'The Perimeter' ? 'camp' : (S.w.zone === "Scavenger's Hub" ? 'hub' : 'zone');
        log('Save loaded.');
        render(); return true;
    } catch (e) { log('Save file is corrupted or from an older version.', 'alert'); render(); return false; }
}
function wipeSave(skipConfirm) {
    if (!skipConfirm && !confirm('Erase your save and create a new stalker?')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage blocked */ }
    S = freshState(); C = null; meet = null; mode = 'create';
    render();
}
function toggleTheme() { document.body.classList.toggle('minimalist'); }

// ===================== CHARACTER CREATION =====================
function startGame() {
    const p = S.p, L = LOADOUTS[S.loadout];
    if (!p.name.trim()) p.name = 'Stalker';
    L.weapons.forEach(([n, rds]) => { addWeapon(n); if (rds) addAmmo(WEAPONS[n].cal, 'Standard', rds); });
    p.armor = { name: L.armor, cond: 'Working', mods: [] };
    if (L.backpack) p.backpack = L.backpack;
    Object.entries(L.items).forEach(([n, c]) => addItem(n, c));
    p.ru = L.ru; p.perks = [S.startPerk];
    p.eq = (p.weapons.find(w => WEAPONS[w.name].cat !== 'melee') || p.weapons[0]).id;
    topOffAll(); rollStock(); refreshQuests();
    mode = 'world'; tab = 'camp';
    log('THE PERIMETER. Sagging razor wire, rusted watchtowers. The fire is dead. You need wood.');
    saveGame(true);
}

// ===================== CAMP (A Dark Room loop) =====================
function scavenge() {
    const c = S.c; c.scav++;
    drainSurvival(.1, .1, .05);
    if (c.area <= 0) log('The fence-line is picked clean. Give it time, or go deeper into the Zone.', 'warn');
    else {
        const r = Math.random();
        if (r < .5) { addItem('Wood', 2); c.area -= 2; log(pick(['Dry branches snapped from a dead birch (+2 Wood).', 'Splintered pallet wood from a collapsed checkpoint (+2 Wood).'])); }
        else if (r < .75) { addItem('Scrap Metal'); c.area -= 4; log('Pried scrap metal off a rusted APC (+1 Scrap).'); }
        else if (r < .87) { const ru = 5 + d(15); S.p.ru += ru; c.area -= 3; log(`${ru} Ru in the pocket of an abandoned uniform.`); }
        else if (r < .93) { addItem('MRE'); c.area -= 3; log('An unopened MRE in a ditch. Lucky.'); }
        else if (r < .96) { addItem('Bandage'); c.area -= 3; log('A sealed field dressing in a burst first-aid box.'); }
        else log('Nothing but weeds and broken glass.');
    }
    if (c.lit && !c.yefim && c.scav - c.scavAtLit >= 4) {
        c.yefim = true;
        log('A grizzled veteran in an old trenchcoat walks up to your fire. "Name is Old Man Yefim. You look like you need supplies. Let\'s do business."', 'gold');
    }
    tickEmission();
}
function lightFire() {
    if (!take('Wood', 5)) return;
    const c = S.c; c.fire = 3;
    if (!c.lit) { c.lit = true; c.scavAtLit = c.scav; log('The fire is burning. Past the wire, the Zone waits. (Zone tab unlocked.)', 'gold'); }
    else log('The fire catches again.');
}
function stoke() { if (S.c.fire >= 4 || !take('Wood')) return; S.c.fire++; log(`You feed the fire. It is ${FIRE[S.c.fire]}.`); }
function buildShelter() { if (!take('Wood', 15)) return; S.c.shelter = true; log('A lean-to shelter stands beside the fire. You can sleep here now.', 'good'); }
function sleepCamp() {
    if (S.w.emission) return log('The sky is screaming. No one sleeps through an emission.', 'alert');
    const p = S.p; p.hp = Math.min(D().maxHp, p.hp + 30); p.tired = 10; drainSurvival(1.5, 1.5, 0);
    log('You sleep in the lean-to (+30 HP, Tiredness restored).');
    newDay(); autoEat(); saveGame(true);
}

// ===================== LIVING WORLD (file 10 missing — improvised) =====================
function newDay() {
    const w = S.w; w.day++;
    log(`— Dawn of day ${w.day} —`, 'day');
    const f = pick(Object.keys(w.goals)); w.goals[f]++;
    if (w.goals[f] >= 6) { log(`${f} complete a major operation. Rumors of it spread through every camp.`, 'day'); w.goals[f] = 0; }
    else log(`Faction movement: ${f} operations advance (${w.goals[f]}/6).`);
    const r = d(20);
    if (r >= 19) {
        const Z = ZONES[w.zone];
        if (Z.indoor || Z.safe) log('An emission rolls over the Zone. You sit it out behind concrete.', 'warn');
        else { w.emission = 3; log('EMISSION ALARM — the sky bleeds red! Reach indoor shelter within 3 moves!', 'alert'); }
    } else if (r >= 15) log('Anomaly shift: the fields rearrange themselves. Fresh artifacts wait.');
    else if (r >= 9) log('A caravan reached the traders. New stock on the shelves.');
    else log('A quiet day in the Exclusion Zone.');
    rollStock(); refreshQuests();
}
function tickEmission() {
    const w = S.w; if (!w.emission) return false;
    const Z = ZONES[w.zone];
    if (Z.indoor || Z.safe) { w.emission = 0; log('You reach shelter. The emission howls past the walls and fades.', 'good'); return false; }
    w.emission--;
    if (w.emission > 0) { log(`The emission builds... ${w.emission} move(s) left to find shelter!`, 'alert'); return false; }
    const dmg = Math.max(1, Math.ceil(60 * (1 - playerDR('anom'))));
    S.p.st.rad = true;
    return hurtOutside(dmg, `CAUGHT IN THE OPEN: the emission tears through you for ${dmg} damage. You are Irradiated.`);
}

// ===================== TRAVEL & EXPLORATION =====================
function travel(dest) {
    const Z = ZONES[dest];
    if (Z.endgame && !allFrags()) return log('The blast vault lock needs all three data fragments.', 'alert');
    drainSurvival(1.5, 1.5, 1); autoEat();
    if (starving()) log('You are STARVING or exhausted: weapon actions cost +1 AP.', 'alert');
    if (S.p.st.rad && hurtOutside(5, 'Radiation sickness gnaws at you on the march (−5 HP).')) return;
    S.w.zone = dest;
    if (!S.w.visited.includes(dest)) S.w.visited.push(dest);
    log(`Traveled to ${dest}. ${Z.desc}`);
    checkRank();
    if (tickEmission()) return;
    if (Z.safe) { tab = 'hub'; saveGame(true); return; }
    tab = dest === 'The Perimeter' ? 'camp' : 'zone';
    const enc = rollEncounter(dest);
    if (enc) beginEncounter(enc, 'travel'); else log('You arrive without incident.');
    if (mode === 'world') saveGame(true);
}
function explore() {
    const z = S.w.zone;
    drainSurvival(.5, .5, .5);
    if (tickEmission()) return;
    const enc = rollEncounter(z);
    if (enc) beginEncounter(enc, 'explore');
    else enterTactical(z, []);
}
function searchHidden() {
    const Z = ZONES[S.w.zone], r = d(20), m = statMod(S.p.stats.P), tot = r + m;
    drainSurvival(.2, .2, .3);
    if (tot >= Z.subDC) { S.w.found.push(Z.sub); log(`Perception ${r}${sgn(m)} = ${tot} vs DC ${Z.subDC}: you find a hidden way into ${Z.sub}!`, 'gold'); }
    else log(`Perception ${r}${sgn(m)} = ${tot} vs DC ${Z.subDC}: nothing but rubble and rust.`);
}
const encChance = Z => Z.hazard >= 4 ? 100 : Math.round((Z.hazard * .15 + Z.tier * .05) * 100);
function questTarget(zone) {
    for (const q of S.w.quests) for (const o of q.objs) if (o.t === 'kill' && o.zone === zone && o.have < o.need) return o;
    return null;
}
function hostileFaction(f) {
    if (f === 'Raiders') return true;
    if (f === 'Obelisk') return S.w.story.ending !== 'Obelisk';
    return S.w.rep[f] <= -3;
}
function rollEncounter(zone) {
    const Z = ZONES[zone]; if (Z.safe) return null;
    if (Z.endgame) return S.w.story.done ? squad('Obelisk', Z.tier) : bossSquad();
    let chance = Z.hazard * .15 + Z.tier * .05;
    const q = questTarget(zone);
    if (q) chance = Math.max(chance, .6);
    if (Z.hazard < 4 && Math.random() >= chance) return null;
    if (q && Math.random() < .7) return q.name ? mutantGroup(Z.tier, q.name) : squad(q.faction, Z.tier);
    const foe = pick(Z.foes);
    return foe === 'mutant' ? mutantGroup(Z.tier) : squad(foe, Z.tier);
}
function mutantGroup(tier, name) {
    if (!name) {
        const lo = Math.max(1, Math.min(tier, 5) - 2);
        name = pick(Object.keys(MUTANTS).filter(n => MUTANTS[n].tier <= tier && MUTANTS[n].tier >= lo));
    }
    const m = MUTANTS[name];
    const n = m.swarm ? 3 + (Math.random() < .4 ? 1 : 0) : m.pack ? 2 + (Math.random() < .4 ? 1 : 0) : 1;
    const units = Array.from({ length: n }, () => mkMutant(name));
    if (m.tier >= 3 && Math.random() < .3) units.push(mkMutant(pick(['Blind Maw', 'Flesh Stalker'])));
    return { faction: 'mutant', units, hostile: true };
}
function mkMutant(name) { const m = MUTANTS[name]; return { kind: 'mutant', name, m, tier: m.tier, hp: m.hp, maxHp: m.hp, ac: m.ac, ap: m.ap, mp: m.mp, cloaked: !!m.cloak, alive: true }; }
function roleFor(wd) { return ['assault', 'heavy', 'sniper'].includes(wd.cat) ? 'Anchor' : ['shotgun', 'smg'].includes(wd.cat) ? 'Rusher' : 'Flanker'; }
function mkHuman(faction, tier, rank) {
    if (rank === undefined) {
        const wts = {}; DECKS[faction].forEach((v, i) => { if (v && i <= Math.min(6, tier + 1)) wts[i] = v; });
        rank = Object.keys(wts).length ? +wpick(wts) : 0;
    }
    const gt = [1, 1, 2, 3, 4, 4, 5][rank];
    const wd = pick(Object.values(WEAPONS).filter(w => !w.lootOnly && w.cat !== 'melee' && w.tier === gt && (w.cat !== 'heavy' || rank >= 3)));
    let apool = Object.values(ARMOR).filter(a => a.tier === gt && (faction === 'Obelisk') === a.name.includes('Obelisk'));
    if (!apool.length) apool = Object.values(ARMOR).filter(a => a.tier === gt);
    const armor = pick(apool), R = RANKS[rank];
    const g = { frag: rank >= 2 ? 1 : 0, smoke: 0, flash: 0 };
    if (rank >= 2 && ['Garrison', 'Sentinels', 'Contractors', 'IZC', 'Obelisk'].includes(faction)) g[d(6) <= 3 ? 'smoke' : 'flash'] = 1;
    return {
        kind: 'human', name: `${faction} ${R.name}`, faction, rank, hp: 100, maxHp: 100, ac: Math.max(10, 10 + R.mod), apMax: R.ap,
        mpMax: armor.mp + (rank >= 4 ? 1 : 0), weapon: { name: wd.name, cond: 'Working', mag: wd.cap, jammed: false },
        armor: { name: armor.name, cond: 'Working' }, role: roleFor(wd), morale: 'Steady', wounds: {}, grenades: g, alive: true,
    };
}
function squad(faction, tier) {
    const n = tier <= 1 ? 1 + (Math.random() < .5 ? 1 : 0) : tier === 2 ? 2 : tier <= 4 ? 2 + (Math.random() < .5 ? 1 : 0) : 3 + (Math.random() < .5 ? 1 : 0);
    const units = Array.from({ length: n }, () => mkHuman(faction, tier));
    if (units.length >= 2) units.reduce((a, b) => (b.rank > a.rank ? b : a)).role = 'Leader';
    return { faction, units, hostile: hostileFaction(faction) };
}
function bossSquad() {
    const boss = mkHuman('Obelisk', 7, 6);
    Object.assign(boss, { name: 'Obelisk Arch-Zealot', hp: 150, maxHp: 150, boss: true, role: 'Leader', weapon: { name: 'FT-200M (F2000)', cond: 'Working', mag: 30, jammed: false }, armor: { name: 'Obelisk Exoskeleton', cond: 'Working' } });
    return { faction: 'Obelisk', units: [boss, mkHuman('Obelisk', 5, 3), mkHuman('Obelisk', 5, 3)], hostile: true };
}
function beginEncounter(enc, via) {
    if (enc.hostile) { enterTactical(S.w.zone, enc.units); return; }
    meet = { enc, via };
    tab = 'zone';
    log(`You cross paths with a ${enc.faction} patrol (${enc.units.length}). They watch you, weapons low.`, 'warn');
}
function resolveMeet(attack) {
    const { enc, via } = meet; meet = null;
    if (attack) {
        S.w.rep[enc.faction] -= 1;
        log(`You open fire on the ${enc.faction}! (${enc.faction} rep ${S.w.rep[enc.faction]})`, 'alert');
        enterTactical(S.w.zone, enc.units);
    } else {
        log(`The ${enc.faction} patrol moves on.`);
        if (via === 'explore') enterTactical(S.w.zone, []);
    }
}

// ===================== HUB & TRADE =====================
function pay(n) { if (S.p.ru < n) { log(`Insufficient Ru (need ${n}).`, 'alert'); return false; } S.p.ru -= n; return true; }
function restAtHub() {
    if (!pay(50)) return;
    S.p.hp = D().maxHp; S.p.tired = 10;
    log('You rent a secure cot at the Rusty Anchor and sleep like the dead (full HP, Tiredness restored).', 'good');
    newDay(); saveGame(true);
}
function buyDrink() { if (!pay(20)) return; log(pick(RUMORS)); }
const WPRICE = [0, 400, 1200, 3000, 6500, 13000], CATM = { melee: .5, sidearm: .6, smg: .8, shotgun: .85, assault: 1, sniper: 1.15, heavy: 1.3 };
const APRICE = [0, 500, 1600, 3800, 7500, 15000], ARTPRICE = [0, 1200, 2500, 5000, 8000, 14000];
function basePrice(it) {
    switch (it.kind) {
        case 'weapon': { const w = WEAPONS[it.name]; return Math.round(WPRICE[w.tier] * CATM[w.cat] / 10) * 10; }
        case 'armor': return APRICE[ARMOR[it.name].tier];
        case 'art': return ARTPRICE[ARTS[it.name].tier];
        case 'detector': return DETECTORS[it.name].price;
        case 'backpack': return BACKPACKS[it.name].price;
        case 'mod': return MODS[it.name].price;
        default: return ITEMS[it.name].price;
    }
}
const TRADER_FAC = { yefim: 'Wanderers', hub: 'Sentinels' };
function priceMod(board) {
    if (board === 'yefim' && S.w.prog.arcDone) return .85;
    const r = S.w.rep[TRADER_FAC[board]];
    return r >= 3 ? .85 : 1;
}
function stockLabel(it) {
    if (it.kind === 'weapon') { const w = WEAPONS[it.name]; return `${it.name} (${CAT[w.cat].label}, ${w.dmg} dmg, rng ${w.range}, ${w.weight}kg, T${w.tier})`; }
    if (it.kind === 'armor') { const a = ARMOR[it.name]; return `${it.name} (Phys ${pct(a.phys)} / Anom ${pct(a.anom)}, ${a.belt} belt, ${a.slots} mod, MP ${a.mp}, ${a.weight}kg)`; }
    if (it.kind === 'art') return `${it.name} — ${artDesc(it.name)}`;
    if (it.kind === 'detector') return `${it.name} (+${DETECTORS[it.name].bonus} avoidance${DETECTORS[it.name].reveal ? ', reveals anomalies' : ''})`;
    if (it.kind === 'backpack') return `${it.name} (+${BACKPACKS[it.name].carry}kg)`;
    if (it.kind === 'mod') return `${it.name} (${MODS[it.name].desc})`;
    const I = ITEMS[it.name]; return `${it.name}${I.heal ? ` (+${I.heal} HP)` : I.temp ? ` (+${I.temp} temp HP)` : ''}`;
}
function grant(it) {
    const p = S.p;
    if (it.kind === 'weapon') addWeapon(it.name, it.cond || 'Working');
    else if (it.kind === 'armor') { const a = { name: it.name, cond: it.cond || 'Working', mods: [] }; if (!p.armor) p.armor = a; else p.spareArmor.push(a); }
    else if (it.kind === 'art') p.arts.push(it.name);
    else if (it.kind === 'detector') p.detector = it.name;
    else if (it.kind === 'backpack') p.backpack = it.name;
    else addItem(it.name, it.n || 1);
}
function buyStock(board, i, price) {
    const it = S.w.stock[board][i];
    if (!pay(price)) return;
    grant(it); S.w.stock[board].splice(i, 1);
    log(`Bought ${it.name} for ${price} Ru.`);
}
function buyAmmo(cal, cat, type, price) { if (!pay(price)) return; addAmmo(cal, type, CAT[cat].box); topOffAll(); log(`Bought a box of ${type} ${cal} (${CAT[cat].box} rds).`); }
function rollStock() {
    const pool = cap => {
        const g = { weapon: [], armor: [], art: [], detector: [], item: [], backpack: [] };
        Object.values(WEAPONS).forEach(w => { if (!w.lootOnly && w.tier <= cap) g.weapon.push({ kind: 'weapon', name: w.name }); });
        Object.values(ARMOR).forEach(a => { if (!a.name.includes('Obelisk') && a.tier <= cap) g.armor.push({ kind: 'armor', name: a.name }); });
        Object.keys(ARTS).forEach(n => { if (!ARTS[n].legend && ARTS[n].tier <= cap) g.art.push({ kind: 'art', name: n }); });
        Object.keys(DETECTORS).forEach(n => { if (DETECTORS[n].bonus <= cap) g.detector.push({ kind: 'detector', name: n }); });
        ['Military Medkit', 'Scientific Medkit', 'Combat Stimpak'].forEach(n => g.item.push({ kind: 'item', name: n }));
        if (cap >= 3) g.backpack.push({ kind: 'backpack', name: 'Tourist Frame' });
        return g;
    };
    const pickN = (cap, n) => {
        const g = pool(cap), out = [], wts = { weapon: 4, armor: 3, art: 2, detector: 1, item: 2, backpack: 1 };
        while (out.length < n) {
            const avail = {}; for (const key in wts) if (g[key].length) avail[key] = wts[key];
            if (!Object.keys(avail).length) break;
            const kind = wpick(avail); out.push(g[kind].splice(Math.floor(Math.random() * g[kind].length), 1)[0]);
        }
        return out;
    };
    S.w.stock.yefim = pickN(2, 5);
    S.w.stock.hub = pickN(4, 9);
    S.w.stock.mods = shuffle(Object.keys(MODS)).slice(0, 4);
}
function sellValue(kind, name, cond) {
    if (kind === 'item') return ITEMS[name].sell ?? Math.round((ITEMS[name].price || 0) * .4);
    if (kind === 'art') return Math.round(ARTPRICE[ARTS[name].tier] * .5);
    return Math.round(basePrice({ kind, name }) * .4 * COND_F[cond || 'Working']);
}
function sellItem(name) { if (!take(name)) return; const v = sellValue('item', name); S.p.ru += v; log(`Sold ${name} for ${v} Ru.`); }
function sellWeapon(id) {
    const p = S.p, w = p.weapons.find(x => x.id === id); if (!w || w.id === p.eq) return;
    const wd = WEAPONS[w.name]; if (wd.cal && w.mag) addAmmo(wd.cal, w.ammo, w.mag);
    const v = sellValue('weapon', w.name, w.cond); p.ru += v; p.weapons = p.weapons.filter(x => x !== w); log(`Sold ${w.name} (${w.cond}) for ${v} Ru.`);
}
function sellArmor(i) { const a = S.p.spareArmor[i]; const v = sellValue('armor', a.name, a.cond); S.p.ru += v; S.p.spareArmor.splice(i, 1); log(`Sold ${a.name} (${a.cond}) for ${v} Ru.`); }
function sellArt(i) { const n = S.p.arts[i]; if (ARTS[n].legend) return; const v = sellValue('art', n); S.p.ru += v; S.p.arts.splice(i, 1); log(`Sold ${n} for ${v} Ru.`); }
const repairCost = (tier, cond) => ['Working', 'Dirty', 'Damaged', 'Broken'].indexOf(cond) * 60 * tier;
function techRepair(obj, tier) {
    const cost = repairCost(tier, obj.cond); if (!cost || !pay(cost)) return;
    obj.cond = 'Working'; obj.jammed = false; log(`The technician restores ${obj.name} to Working (${cost} Ru).`, 'good');
}
function installMod(i) {
    const p = S.p, mod = S.w.stock.mods[i], a = p.armor;
    if (!a) return log('Wear armor first.', 'alert');
    if (a.mods.includes(mod) || a.mods.length >= ARMOR[a.name].slots) return log('No free mod slot for that.', 'alert');
    if (!pay(MODS[mod].price)) return;
    a.mods.push(mod); S.w.stock.mods.splice(i, 1);
    log(`Technician fits ${mod} onto your ${a.name}.`, 'good');
}

// ===================== GEAR MANAGEMENT =====================
function equipWeapon(id) {
    if (mode === 'combat') {
        const to = S.p.weapons.find(w => w.id === id), cost = swapCost(to);
        if (!actOK(cost)) return;
        C.ap -= cost;
    }
    S.p.eq = id; log(`Equipped ${eqW().name}.`);
}
function cycleAmmo(w) {
    const wd = WEAPONS[w.name]; if (!wd.cal) return;
    const types = Object.keys(AMMO), opts = types.filter(t => t === w.ammo || ammoCount(wd.cal, t) > 0);
    if (opts.length < 2) return log(`No other ammo types for ${wd.cal}.`, 'warn');

}
function wearArmor(i) {
    const p = S.p, a = p.spareArmor.splice(i, 1)[0];
    if (p.armor) p.spareArmor.push(p.armor);
    p.armor = a;
    const slots = D().beltSlots;

}
function wearArt(i) { const p = S.p; if (p.belt.length >= D().beltSlots) return log('No free belt slot.', 'alert'); p.belt.push(p.arts.splice(i, 1)[0]); clampHp(); }

        else {
            c1 += B(`${wd.cat === 'melee' ? 'Strike' : 'Shoot'} (${attackCost(false)} AP) [F]`, () => playerAttack(false), { cls: 'c-btn red', dis });
            if (burstOf(wd)) c1 += B(`Burst (${attackCost(true)} AP) [B]`, () => playerAttack(true), { cls: 'c-btn red', dis });
        }
        c1 += B(`Aim (1 AP)`, aim, { cls: 'c-btn', dis });
    }
    if (w && wd.cal) {
        c1 += B(`Reload (${reloadCost()} AP) [R]`, reload, { cls: 'c-btn yel', dis });
        c1 += B(`Ammo: ${AMMO[w.ammo].short} ▸`, () => cycleAmmo(w), { cls: 'c-btn yel' });
    }
    p.weapons.forEach(x => { if (x.id !== p.eq) c1 += B(`Swap: ${x.name} (${swapCost(x)} AP)`, () => equipWeapon(x.id), { cls: 'c-btn', dis }); });
    h += `<div class="controls">${c1}</div>`;
    let c2 = '';
    if (dis) c2 += B('Stand up (1 AP)', standUp, { cls: 'c-btn blue' });
    if (hostile) {
        c2 += B('Take Cover (2 AP)', takeCover, { cls: 'c-btn blue', dis: dis || !playerHasCover() });
        c2 += B('Evasive (2 AP)', evasive, { cls: 'c-btn blue', dis });
        if (curTarget() && curTarget().kind === 'human') c2 += B('Intimidate (2 AP)', intimidate, { cls: 'c-btn blue', dis });
        ['Frag Grenade', 'Smoke Grenade', 'Flashbang'].forEach(g => { if (count(g)) c2 += B(`${g} ×${count(g)} (${wpnCost(2)} AP)`, () => { C.pending = g; }, { cls: 'c-btn blue', dis }); });
        if (C.units.some(u => active(u) && u.leapReady)) c2 += B('Dodge leap (1 AP)', dodgeLeap, { cls: 'c-btn blue', dis: dis || !!C.dodge });
    }
    c2 += B('Search anomaly (2 AP)', searchAnomaly, { cls: 'c-btn pur', dis: dis || !adjacentTile((x, y) => { const a = C.anoms[k(x, y)]; return a && a.resolved && !a.searched; }) });
    c2 += B('Interact D/T/S (2 AP)', interact, { cls: 'c-btn pur', dis: dis || !adjacentTile((x, y) => 'DTS'.includes(tileAt(x, y)) && tileAt(x, y) !== '#') });
    h += `<div class="controls">${c2}</div>`;
    let c3 = '';
    if (hostile) c3 += B('Flee the area (map edge)', () => leaveArea(true), { cls: 'c-btn', dis: !onEdge() || dis });
    else c3 += B('Leave the area', () => leaveArea(false), { cls: 'c-btn', style: 'border-color:#4f4' });
    c3 += B('End Turn [E]', endTurn, { cls: 'c-btn', style: 'background:#555' });
    h += `<div class="controls">${c3}</div>`;
    return h;
}
function combatLootPanel() {
    let h = '';
    const pris = C.units.filter(u => u.surrendered && !u.resolved);
    pris.forEach(u => {
        h += `<div class="panel gold-b">${uname(u)} has surrendered.<div class="row">`
            + (u.asked ? '' : B('Interrogate', () => prisoner(u, 'interrogate'), { cls: 'inv-btn' }))
            + B('Take their gear', () => prisoner(u, 'loot'), { cls: 'inv-btn' })
            + B('Let them go', () => prisoner(u, 'free'), { cls: 'inv-btn' })
            + B('Execute', () => prisoner(u, 'execute'), { cls: 'inv-btn' }) + '</div></div>';
    });
    const loot = C.loot.filter(l => !l.taken);
    if (loot.length) {
        h += '<div class="panel"><b>Loot</b> ' + B('Take all', () => loot.forEach(takeLoot), { cls: 'inv-btn' });
        loot.forEach(l => { h += `<div class="inv-item"><span>${lootLabel(l)}</span>${B('Take', () => takeLoot(l), { cls: 'inv-btn' })}</div>`; });
        h += '</div>';
    }
    return h;
}
function gridHTML() {
    const reach = myTurn() && !C.pending && !S.p.st.prone ? dijkstra(C.px, C.py, playerPass) : null;
    let h = '<div class="grid">';
    for (let y = 0; y < C.H; y++) {
        h += '<div class="grow">';
        for (let x = 0; x < C.W; x++) {
            let ch = C.map[y][x], cls = TILE_CLS[ch] || '';
            const a = C.anoms[k(x, y)];
            if (a && a.revealed) { ch = '!'; cls = 'c-anom' + (a.searched ? ' c-dim' : ''); }
            if (smokeAt(x, y)) cls += ' c-smoke';
            const ui = C.units.findIndex(u => onMap(u) && u.x === x && u.y === y);
            if (x === C.px && y === C.py) { ch = '@'; cls = 'c-player'; }
            else if (ui >= 0 && visible(C.units[ui])) {
                const u = C.units[ui]; ch = String(ui + 1);
                cls = u.surrendered ? 'c-dim' : u.kind === 'human' ? 'c-human' : 'c-mutant';
                if (u.id === C.target) cls += ' c-target';
            } else if (reach) { const dd = reach.dist[y * C.W + x]; if (dd > 0 && dd <= C.mp) cls += ' c-reach'; }
            h += `<span class="cell ${cls}" data-x="${x}" data-y="${y}">${ch}</span>`;
        }
        h += '</div>';
    }
    return h + '</div>';
}

// ===================== INPUT =====================
function afterAction() { if (mode === 'combat' && C) checkClear(); render(); }
document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (b) { if (b.disabled) return; const f = H[+b.dataset.a]; if (f) { freshLog(); f(); afterAction(); } return; }
    const cell = e.target.closest('.cell');
    if (cell && mode === 'combat') { freshLog(); gridClick(+cell.dataset.x, +cell.dataset.y); afterAction(); }
});
document.addEventListener('keydown', e => {
    if (mode !== 'combat' || e.target.tagName === 'INPUT') return;
    const key = e.key.toLowerCase();
    const mv = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] }[key];
    freshLog();
    if (mv) { e.preventDefault(); stepPlayer(...mv); }
    else if (key === 'e') endTurn();
    else if (key === 'f') playerAttack(false);
    else if (key === 'b' && eqWD() && burstOf(eqWD())) playerAttack(true);
    else if (key === 'r') reload();
    else return;
    afterAction();
});

// ===================== HEARTBEAT (real-time, out of combat) =====================
setInterval(() => {
    tick++;
    if (mode !== 'world') return;
    const c = S.c, p = S.p, d0 = D();
    let dirty = false;
    if (tick % 2 === 0 && c.area < 100) c.area++;
    if (c.fire > 0 && tick % 90 === 0) { c.fire--; log(c.fire ? `The fire is ${FIRE[c.fire]}.` : 'The fire has gone out.'); dirty = true; }
    if (tick % 10 === 0) {
        if (d0.regen && p.hp < d0.maxHp) { p.hp = Math.min(d0.maxHp, p.hp + d0.regen); dirty = true; }
        if ((p.st.bleed || p.st.toxic) && !d0.noBleed && d0.bleedDmg > 0) { p.hp -= d0.bleedDmg; log(`You are bleeding (−${d0.bleedDmg} HP). Use a Bandage.`, 'alert'); dirty = true; }
        if (p.st.rad) { p.hp -= 1; dirty = true; }
        if (p.hp <= 0) { die(); render(); return; }
    }
    if (tick % 30 === 0) saveGame(true);
    if (dirty) render();
}, 1000);

// ===================== BOOT =====================
S = freshState();
let hasSave = false;
try { hasSave = !!localStorage.getItem(SAVE_KEY); } catch (e) { /* storage blocked */ }
if (!(hasSave && loadGame())) { mode = 'create'; render(); }
</script>
