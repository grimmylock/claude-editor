<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ZONE — Solo Survival RPG</title>
<style>
    * { box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #b0b0b0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 15px; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    #game-container { display: flex; width: 100%; max-width: 1500px; gap: 15px; position: relative; height: 100%; }
    .column { flex: 1; display: flex; flex-direction: column; padding: 8px; overflow-y: auto; }
    #left-col { border-right: 1px solid #2a2a2a; max-width: 320px; }
    #right-col { border-left: 1px solid #2a2a2a; max-width: 380px; }
    #mid-col { flex: 1.8; align-items: center; }
    #view { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .stat-bar { margin-bottom: 2px; font-size: 0.85em; }
    .alert { color: #ff4444; font-weight: bold; }
    .warn { color: #ffaa00; }
    .good { color: #44ff44; }
    .gold { color: #ffd700; }
    .dim, .muted { color: #666; }
    .day { color: #8af; }
    .small { font-size: 0.75em; }
    .center { text-align: center; }
    .emission { color: #ff2222; text-shadow: 0 0 5px #ff0000; font-weight: bold; }

    .top-bar { position: absolute; top: -12px; right: 0; display: flex; gap: 6px; z-index: 10; }
    .top-bar button { background: #111; border: 1px solid #333; color: #777; cursor: pointer; font-family: inherit; font-size: 0.75em; padding: 2px 6px; }
    .top-bar button:hover { color: #fff; border-color: #888; }

    .nav-tabs { display: flex; gap: 6px; margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; width: 100%; justify-content: center; padding-bottom: 8px; flex-wrap: wrap; min-height: 8px; }
    .tab-btn { background: none; border: 1px solid #333; color: #666; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.8em; }
    .tab-btn.active { color: #fff; border-color: #888; background-color: #1a1a1a; }
    .tab-btn:hover:not(.active) { color: #aaa; }

    .btn { background-color: #141414; color: #aaa; border: 1px solid #333; padding: 7px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit; width: 92%; text-align: center; transition: 0.15s; font-size: 0.85em; }
    .btn:hover:not(:disabled) { background-color: #262626; color: #fff; border-color: #666; }
    .btn:disabled, .c-btn:disabled, .inv-btn:disabled, .stat-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn.sel { border-color: #ffd700; color: #ffd700; }

    .stat-btn { background: #111; color: #44ff44; border: 1px solid #333; cursor: pointer; font-family: inherit; font-size: 0.8em; padding: 0 6px; margin-left: 3px; }
    .inv-item { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 3px; border-bottom: 1px dashed #222; padding-bottom: 2px; font-size: 0.8em; width: 100%; }
    .inv-btn { background: #1a1a1a; color: #888; border: 1px solid #444; cursor: pointer; font-family: inherit; font-size: 0.75em; padding: 1px 4px; white-space: nowrap; }
    .inv-btn:hover:not(:disabled) { color: #fff; border-color: #777; }

    .log-entry { margin-bottom: 6px; opacity: 0.8; font-size: 0.82em; line-height: 1.3; }
    .log-new { opacity: 1; }
    .log-new:not(.alert):not(.warn):not(.good):not(.gold):not(.day) { color: #fff; }
    h2 { font-size: 1em; border-bottom: 1px solid #2a2a2a; padding-bottom: 3px; width: 100%; text-align: center; margin: 6px 0; color: #ddd; }
    h3 { font-size: 0.85em; border-bottom: 1px solid #222; padding-bottom: 2px; width: 100%; margin: 10px 0 4px 0; color: #888; text-transform: uppercase; }
    p { font-size: 0.85em; line-height: 1.4; width: 92%; }
    .panel { border: 1px solid #444; padding: 6px 8px; margin-bottom: 6px; width: 100%; font-size: 0.82em; line-height: 1.4; }
    .panel.gold-b { border-color: #ffd700; }
    .panel.red-b { border-color: #a33; }
    .row { width: 100%; font-size: 0.82em; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .text-in { background: #111; color: #fff; border: 1px solid #444; font-family: inherit; padding: 5px; width: 92%; }

    .grid { background: #000; border: 1px solid #333; padding: 6px; font-size: 1.1em; line-height: 1.25; user-select: none; margin: 6px 0; max-width: 100%; overflow-x: auto; }
    .grow { display: flex; }
    .cell { width: 1.35em; min-width: 1.35em; text-align: center; cursor: pointer; color: #3a6; }
    .cell:hover { outline: 1px solid #555; }
    .c-wall { color: #555; } .c-cover { color: #bb9; } .c-hard { color: #dd6; } .c-high { color: #8af; } .c-rubble { color: #765; } .c-trench { color: #a86; }
    .c-quest { color: #ffd700; font-weight: bold; }
    .c-door { color: #c8f; } .c-term { color: #0ff; } .c-anom { color: #f0f; }
    .c-player { color: #fff; font-weight: bold; } .c-human { color: #f55; font-weight: bold; } .c-mutant { color: #fa4; font-weight: bold; } .c-dim { color: #666; }
    .c-target { background: #500; } .c-smoke { background: #333; } .c-reach { background: #0b1d0b; }
    .controls { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .c-btn { background: #181818; color: #ddd; border: 1px solid #444; padding: 5px 8px; cursor: pointer; font-family: inherit; font-size: 0.8em; }
    .c-btn:hover:not(:disabled) { background-color: #333; color: #fff; }
    .c-btn.red { background: #500; } .c-btn.blue { background: #034; } .c-btn.yel { background: #330; } .c-btn.pur { background: #303; }
    .apbar { color: #00ffff; font-weight: bold; margin: 4px 0; font-size: 0.85em; text-align: center; }

    body.minimalist { background-color: #000 !important; color: #fff !important; }
    body.minimalist * { border-color: #fff !important; }
    body.minimalist .btn, body.minimalist .tab-btn, body.minimalist .c-btn, body.minimalist .inv-btn, body.minimalist .stat-btn { background-color: #000 !important; color: #fff !important; }
    body.minimalist .btn:hover, body.minimalist .tab-btn.active, body.minimalist .c-btn:hover:not(:disabled) { background-color: #fff !important; color: #000 !important; }
    body.minimalist .cell, body.minimalist .apbar { color: #fff !important; }

    /* Work mode: a plain light chat-assistant look. The log is the conversation, the current screen is the latest reply. */
    .work-only { display: none; }
    body.work { background: #fff; color: #1f2328; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 0; }
    body.work .work-only { display: block; }
    body.work #game-container { flex-direction: column; max-width: 760px; margin: 0 auto; gap: 0; overflow-y: auto; padding: 0 16px; }
    body.work .top-bar { position: sticky; top: 0; order: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 0; align-items: center; }
    body.work .top-bar::before { content: attr(data-head); margin-right: auto; font-weight: 600; }
    body.work .top-bar button { background: none; border: none; color: #6b7280; font-family: inherit; font-size: 0.8em; white-space: nowrap; }
    body.work .top-bar button:hover { color: #111; }
    body.work .column { flex: none; padding: 8px 0; max-width: none; border: none; overflow: visible; }
    body.work #left-col { display: none; }
    body.work #right-col { order: 3; border: none; border-top: 1px solid #e5e7eb; margin-top: 8px; max-width: none; }
    body.work #right-col h2 { display: none; }
    body.work #log-content { display: flex; flex-direction: column; max-height: 45vh; overflow-y: auto; }
    body.work .log-entry { background: #f4f4f5; border-radius: 12px; padding: 8px 12px; margin: 4px 0; max-width: 85%; font-size: 0.9em; opacity: 1; color: #1f2328 !important; text-shadow: none; }
    body.work .log-entry.user { align-self: flex-end; background: #e8eefc; }
    body.work #mid-col { order: 2; flex: none; align-items: stretch; }
    body.work #view { align-items: stretch; }
    body.work #empty { order: 3; text-align: center; font-size: 1.5em; color: #374151; padding-top: 28vh; flex: 1; display: none; }
    body.work.hide #empty { display: block; }
    body.work.hide #left-col, body.work.hide #right-col, body.work.hide #mid-col { display: none; }
    body.work #composer { order: 4; position: sticky; bottom: 0; background: #fff; padding: 10px 0 16px; margin-top: auto; }
    body.work #composer input { width: 100%; border: 1px solid #d1d5db; border-radius: 20px; padding: 10px 16px; background: #fff; color: #1f2328; font: inherit; outline: none; }
    body.work .btn, body.work .c-btn, body.work .tab-btn, body.work .inv-btn, body.work .stat-btn { background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 10px; font-family: inherit; }
    body.work .btn { width: 100%; text-align: left; }
    body.work .btn:hover:not(:disabled), body.work .c-btn:hover:not(:disabled), body.work .tab-btn:hover, body.work .inv-btn:hover:not(:disabled) { background: #f3f4f6; color: #111; border-color: #9ca3af; }
    body.work .btn.sel { border-color: #2563eb; color: #2563eb; }
    body.work .tab-btn.active { background: #f3f4f6; color: #111; border-color: #9ca3af; }
    body.work .nav-tabs, body.work h2, body.work h3, body.work .inv-item { border-color: #e5e7eb; }
    body.work h2 { text-align: left; color: #111; text-transform: none !important; border: none; font-size: 1.05em; }
    body.work h3 { color: #6b7280; text-transform: none; }
    body.work p { width: 100%; }
    body.work .alert, body.work .warn, body.work .good, body.work .gold, body.work .day, body.work .emission, body.work .apbar { color: inherit; text-shadow: none; }
    body.work .muted, body.work .dim { color: #6b7280; }
    body.work [style*="color"] { color: inherit !important; }
    body.work .panel { border-color: #e5e7eb; border-radius: 8px; }
    body.work .text-in { background: #fff; color: #1f2328; border-color: #d1d5db; }
    body.work .grid { background: #f6f8fa; border-color: #e5e7eb; border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95em; }
    /* combat in work mode: no title or legend, and the map reads as a plain-text code block in one ink colour */
    body.work .combat-title, body.work .legend { display: none; }
    body.work .grid { position: relative; padding-top: 28px; }
    body.work .grid::before { content: 'plaintext'; position: absolute; top: 6px; left: 10px; font-family: system-ui, sans-serif; font-size: 0.7em; color: #6b7280; }
    body.work .cell { color: #9ca3af; font-weight: normal; } body.work .c-wall, body.work .c-cover, body.work .c-hard, body.work .c-rubble, body.work .c-trench, body.work .c-high, body.work .c-door, body.work .c-term, body.work .c-anom { color: #57606a; }
    body.work .c-player, body.work .c-human, body.work .c-mutant, body.work .c-quest { color: #1f2328; font-weight: 600; }
    body.work .c-floor { color: #e5e7eb; }
    body.work .dpad { display: none; }
    body.work .controls { justify-content: flex-start; }
    body.work #view .center, body.work .apbar { text-align: left; }
    body.work .c-target { background: #e5e7eb; } body.work .c-smoke { background: #f0f1f3; } body.work .c-reach { background: #f3f4f6; }

    @media (max-width: 900px) {
        body { height: auto; overflow: auto; padding: 8px; }
        #game-container { flex-direction: column; }
        #left-col, #right-col { max-width: none; border: none; }
        #right-col { max-height: 40vh; }
    }
</style>
</head>
<body>
<div id="game-container">
    <div class="top-bar">
        <button onclick="saveGame()" data-en="[Save]">[Save]</button>
        <button onclick="loadGame()" data-en="[Load]">[Load]</button>
        <button onclick="wipeSave()" data-en="[Wipe]">[Wipe]</button>
        <button onclick="toggleTheme()" data-en="[Contrast]">[Contrast]</button>
        <button id="lang-btn" onclick="setLang(LANG === 'pt' ? 'en' : 'pt')" data-en="[PT-BR]">[PT-BR]</button>
        <button onclick="setWork(!WORK)" data-en="[Work]">[Work]</button>
    </div>
    <div class="column" id="left-col"></div>
    <div class="column" id="mid-col">
        <div class="nav-tabs" id="main-tabs"></div>
        <div id="view"></div>

        <div id="log-content"></div>

    <div id="empty" class="work-only"></div>

</div>

    // ---- zone descriptions ----
    'Razor-wire checkpoint line between concrete watchtowers, half-swallowed by overgrown fields.': 'Linha de postos com arame farpado entre torres de vigia de concreto, meio engolida pelo mato.',
    'Chemical-sheened wetlands. Off the causeway every step is a wade.': 'Charcos com brilho químico. Fora da passarela, cada passo é dentro d\'água.',
    'A collapsed rail cutting turned smuggling corridor, walled in by crumbling embankments.': 'Um corte ferroviário desabado virou corredor de contrabando, cercado por barrancos em ruína.',
    'Mountains of crushed vehicles stacked into makeshift canyons.': 'Montanhas de veículos esmagados empilhados em cânions improvisados.',
    'Disused processing plants and silos. Machinery groans in the wind.': 'Usinas e silos abandonados. As máquinas gemem com o vento.',
    'A steep ravine strewn with a burned-out Raider convoy.': 'Uma ravina íngreme coberta pelos restos de um comboio queimado de Saqueadores.',
    "The Zone's real capital: a fortified container market run by Sentinels and traders.": 'A verdadeira capital da Zona: um mercado fortificado de contêineres, gerido por Sentinelas e comerciantes.',
    'A sprawling freight yard of rusted rolling stock, still used by Contractor logistics.': 'Um enorme pátio de cargas com vagões enferrujados, ainda usado pela logística dos Contratados.',
    'A cracked lakebed under a derelict power sub-station.': 'Um leito de lago rachado sob uma subestação elétrica abandonada.',
    'A fortified garrison contested between Liberator and Sentinel patrols.': 'Uma guarnição fortificada disputada por patrulhas de Libertadores e Sentinelas.',
    'An evacuated town frozen mid-exodus. Doors still hang open.': 'Uma cidade evacuada, congelada no meio do êxodo. As portas ainda estão abertas.',
    'A forest stained rust-red. Short sightlines, heavy mutant activity.': 'Uma floresta manchada de vermelho-ferrugem. Pouca visibilidade, muita atividade mutante.',
    'A terraced open-pit quarry descending into a flooded, anomaly-tainted floor.': 'Uma pedreira a céu aberto em terraços que desce até um fundo alagado e contaminado por anomalias.',
    'Beached cargo ships loom like dead whales on dry land.': 'Navios cargueiros encalhados se erguem como baleias mortas em terra firme.',
    'Towering antennas hum with anomalous current. Obelisk holy ground.': 'Antenas gigantes zumbem com corrente anômala. Solo sagrado do Obelisco.',
    'Collapsed high-rises and checkpoints. Obelisk and Garrison fight over the ruins.': 'Prédios desabados e postos de controle. Obelisco e Guarnição disputam as ruínas.',
    'Overlapping anomalies around a crater of shifting geometry. No safe path, only a safer one.': 'Anomalias sobrepostas ao redor de uma cratera de geometria mutável. Não há caminho seguro, só um menos perigoso.',
    'A walled district under permanent siege. Trench lines cut through former streets.': 'Um distrito murado sob cerco permanente. Trincheiras cortam as antigas ruas.',
    "The Zone's dead heart. Every arrival here means a fight.": 'O coração morto da Zona. Toda chegada aqui significa luta.',
    'A damp, low cave behind the Rust Culvert.': 'Uma caverna úmida e baixa atrás do Bueiro Enferrujado.', 'A sealed pre-Zone research annex.': 'Um anexo de pesquisa lacrado, de antes da Zona.',
    'Flooded sub-basements, cabling submerged in stagnant water.': 'Subsolos alagados, cabos submersos em água parada.', 'Narrow service tunnels beneath the yard.': 'Túneis de serviço estreitos sob o pátio.',
    'A larger, better-preserved research site under the town.': 'Um centro de pesquisa maior e mais preservado sob a cidade.', 'Caverns choked with hanging roots, unnaturally warm.': 'Cavernas tomadas por raízes pendentes, anormalmente quentes.',

    if (LANG !== 'pt' || !s) return s;

        const keys = Object.keys(PT).sort((a, b) => b.length - a.length).map(x => (/^\w/.test(x) ? '(?<![\\p{L}\\d_])' : '') + esc(x) + (/\w$/.test(x) ? '(?![\\p{L}\\d_])' : ''));

function poolTier(cat, name) { for (let t = 1; t <= 5; t++) if ((POOLS[t][cat] || []).includes(name)) return t; return null; }
function bandOf(kind, name) {
    if (kind === 'weapon') { const w = WEAPONS[name]; return CAT_BAND[w.tier][w.cat]; }
    if (kind === 'armor') return ARMOR_BAND[name];
    if (kind === 'art') return ARTS[name].legend ? [0, 0] : CAT_BAND[ARTS[name].tier].art;
    if (kind === 'mod' || MODS[name]) return CAT_BAND[poolTier('mod', name)].mod;
    if (kind === 'detector') return CAT_BAND[poolTier('det', name)].det;
    if (kind === 'backpack') return name === 'Tourist Frame' ? CAT_BAND[2].pack : [80, 80];
    const it = ITEMS[name];
    if (it && it.price) return [it.price, it.price];
    if (it && it.part) return PART_BAND[it.part];
    const t = poolTier('cons', name); if (t) return CAT_BAND[t].cons;
    return [0, 0];
}
// One d100 on the tier table = one item (file 07). Always returns an array (a lucky find can give two).
function rollLoot(tier, src, opts = {}) {
    let t = clamp(tier, 1, 6);
    if (src !== 'trader' && d(20) <= 5) t = Math.max(1, t - 1); // Tier Drift
    for (let tries = 0; tries < 12; tries++) {
        const r = d(100);
        let cat = r <= 16 ? 'cons' : r <= 21 ? 'melee' : r <= 28 ? 'sidearm' : r <= 33 ? 'smg' : r <= 38 ? 'shotgun' : r <= 45 ? 'assault' : r <= 49 ? 'heavy' : r <= 54 ? 'sniper'
            : r <= 67 ? 'armor' : r <= 72 ? 'mod' : r <= 78 ? 'art' : r <= 83 ? 'detpack' : r <= 90 ? 'cash' : r <= 97 ? 'junk' : 'lucky';
        if (cat === 'lucky') return t >= 5 ? [...rollLoot(5, 'trader', opts), ...rollLoot(5, 'trader', opts)] : rollLoot(t + 1, 'trader', opts);
        if (cat === 'cash') return [{ kind: 'ru', n: randBand(CAT_BAND[Math.min(t, 6)].cash) }];
        if (cat === 'junk') return src === 'npc' ? [{ kind: 'ru', n: 10 + d(41) - 1 }] : [];
        if (opts.noWeapons && WEAPON_CATS.includes(cat)) cat = d(2) === 1 ? 'cons' : 'detpack';
        const pt = Math.min(t, 5);
        if (cat === 'armor') { const pool = Object.values(ARMOR).filter(a => a.tier === pt); const a = pick(pool); return [{ kind: 'armor', name: a.name, price: randBand(ARMOR_BAND[a.name]) }]; }
        if (cat === 'detpack') {
            const pool = [...POOLS[pt].det.map(n => ['detector', n]), ...POOLS[pt].pack.map(n => ['backpack', n])];
            if (!pool.length) continue;
            const [kind, name] = pick(pool); return [{ kind, name, price: randBand(bandOf(kind, name)) }];
        }
        const list = POOLS[pt][cat] || [];
        if (!list.length) continue;
        if (WEAPON_CATS.includes(cat)) {
            let name = pick(list);
            if (pt === 5) {
                if (src === 'trader') return []; // Tier 5 weapons are loot-only: a trader roll becomes Junk
                if (d(20) <= 17) { const t4 = POOLS[4][cat]; if (t4.length) name = pick(t4); }
            }
            return [{ kind: 'weapon', name, price: randBand(bandOf('weapon', name)) }];
        }
        const name = pick(list), kind = cat === 'art' ? 'art' : cat === 'mod' ? 'mod' : 'item';
        return [{ kind, name, price: randBand(bandOf(kind, name)) }];
    }
    return [];
}

// The hand-drawn grids are wide but flat. Grids with an open top/bottom edge get seeded random terrain rows
// (the same every visit) up to 12 rows tall, or 8 for narrow rooms, so fights have vertical room.
for (const key in GRIDS) {
    const G = GRIDS[key], rows = G.rows, W = rows[0].length, need = (W >= 12 ? 12 : 8) - rows.length;
    const open = r => [...r].some(ch => '.C=^~tex!'.includes(ch)), top = open(rows[0]), bot = open(rows[rows.length - 1]);
    if (need <= 0 || !(top || bot)) continue;
    let seed = [...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
    const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const row = () => Array.from({ length: W }, () => { const r = rnd(); return r < .04 ? '#' : r < .09 ? 'C' : r < .11 ? '=' : r < .17 ? '~' : r < .19 ? '^' : '.'; }).join('');
    const nTop = top && bot ? Math.ceil(need / 2) : top ? need : 0;
    G.rows = [...Array.from({ length: nTop }, row), ...rows, ...Array.from({ length: need - nTop }, row)];
}

// ===================== HELPERS: PLAYER =====================
const has = perk => S.p.perks.includes(perk);
const count = item => S.p.inv[item] || 0;
function addItem(i, n = 1) { S.p.inv[i] = count(i) + n; }
function take(i, n = 1) { if (count(i) < n) return false; S.p.inv[i] -= n; if (!S.p.inv[i]) delete S.p.inv[i]; return true; }
function addAmmo(cal, type, n) { S.p.ammo[cal] = S.p.ammo[cal] || {}; S.p.ammo[cal][type] = (S.p.ammo[cal][type] || 0) + n; }
const ammoCount = (cal, type) => (S.p.ammo[cal] && S.p.ammo[cal][type]) || 0;
function addWeapon(name, cond = 'Working', mag = 0) { const w = { id: S.p.nid++, name, cond, mag, ammo: 'Standard', jammed: false, upg: [] }; S.p.weapons.push(w); return w; }
const eqW = () => S.p.weapons.find(w => w.id === S.p.eq) || null;
const eqWD = () => { const w = eqW(); return w ? WEAPONS[w.name] : null; };

// ===================== CAMP (A Dark Room loop) =====================
function scavenge() {
    const c = S.c; c.scav++;
    drainSurvival(.1, .1, .05);
    if (c.area <= 0) log('The fence-line is picked clean. Give it time, or go deeper into the Zone.', 'warn');
    else {
        const r = Math.random();
        if (r < .5) { addItem('Wood', 2); c.area -= 2; log(pick(['Dry branches snapped from a dead birch (+2 Wood).', 'Splintered pallet wood from a collapsed checkpoint (+2 Wood).'])); }
        else if (r < .75) { addItem('Scrap Metal'); c.area -= 4; log('Pried scrap metal off a rusted APC (+1 Scrap).'); }
        else if (r < .87) { const ru = 5 + d(15); S.p.ru += ru; c.area -= 3; log(`${ru} Ru in the pocket of an abandoned uniform.`); }
        else if (r < .93) { addItem('MRE'); c.area -= 3; log('An unopened MRE in a ditch. Lucky.'); }
        else if (r < .96) { addItem('Bandage'); c.area -= 3; log('A sealed field dressing in a burst first-aid box.'); }
        else log('Nothing but weeds and broken glass.');
    }
    if (c.lit && !c.yefim && c.scav - c.scavAtLit >= 4) {
        c.yefim = true;
        addNamed('Old Man Yefim', 'The Perimeter', 'friendly');
        log('A grizzled veteran in an old trenchcoat walks up to your fire and drags a shipping crate under the lean-to tarp. "Name is Old Man Yefim. That\'s my footlocker. Let\'s do business."', 'gold');
    }

}
function lightFire() {
    if (!take('Wood', 5)) return;
    const c = S.c; c.fire = 3;
    if (!c.lit) { c.lit = true; c.scavAtLit = c.scav; log('The fire is burning. Past the wire, the Zone waits. (Zone tab unlocked.)', 'gold'); }
    else log('The fire catches again.');
}
function stoke() { if (S.c.fire >= 4 || !take('Wood')) return; S.c.fire++; log(`You feed the fire. It is ${FIRE[S.c.fire]}.`); }
function buildShelter() { if (!take('Wood', 15)) return; S.c.shelter = true; log('A lean-to shelter stands beside the fire. You can sleep here now.', 'good'); }

    if (S.w.emission) return log('The sky is screaming. No one sleeps through an emission.', 'alert');
    const p = S.p; p.hp = Math.min(D().maxHp, p.hp + hpGain); p.tired = 10;

// ===================== LIVING WORLD (file 10) =====================
function newDay(road) {
    const w = S.w; w.day++; w.crossings = 0; w.wanderRolled = {};
    log(`— Dawn of day ${w.day} —`, 'day');
    const r = d(20), emissionRoll = w.story.ending === 'Contain' ? r === 20 : r >= 19;
    if (emissionRoll) {
        if (isShelter(w.zone)) { log('EMISSION. Sirens wail; you sit it out under cover. When it passes, the anomalies here are freshly charged.', 'warn'); resetAnoms(w.zone, 3); }
        else { w.emission = road ? 1 : 3; log(`EMISSION ALARM — the sky bleeds red! Reach shelter (building, sub-node, outpost or Safe Zone) within ${w.emission} move(s)!`, 'alert'); }
    } else if (r <= 8) { w.extraRumor = 1; log('Zone Event: a quiet day. Someone at the next camp will have extra gossip.'); }
    else if (r <= 10) { w.caravan = true; log('Zone Event: a caravan is waiting at the nearest outpost (+2 extra items in stock).'); }
    else if (r <= 12) {
        const z = pick(ZONES[w.zone].to.filter(x => !ZONES[x].safe)) || w.zone;
        w.migration = { zone: z, until: w.day + 1 };
        log(`Zone Event: mutant migration through ${z} (+15% encounter chance for 2 days).`, 'warn');
    } else if (r <= 14) { log('Zone Event: a faction makes a push.'); rollGoal(); }
    else if (r <= 16) {
        const n = pick(w.named);
        if (n) log(n.status === 'fled' || n.status === 'let go' ? `Zone Event: ${n.name} turns up again (${n.where}) with a grudge — watch your back.` : `Zone Event: ${n.name} (${n.where}) sends word: there may be work.`, 'warn');
        else log('Zone Event: a stranger on the radio asks for help, then goes quiet.');
    } else { resetAnoms(w.zone, 0); log(`Zone Event: anomaly shift in ${w.zone} — searched anomalies can be searched again.`); }

}
function rollGoal() {

    if (w.goals[f] < 6) return;
    w.goalDone[f] = true;
    const msg = {
        Obelisk: 'Obelisk seize The Terraces. The Contractor outpost at Quarry Basin falls; Obelisk patrol Quarry Basin and the Ship Graveyard.',
        Contractors: 'Contractors fortify Ghost Town: its hazard drops by 1, Raiders leave, and the Old Bank opens as a Tier 4 outpost.',
        Raiders: 'Raiders hold the Chokepoint Bridge. Crossing into or out of Black Valley now costs 200 Ru or a fight; its hazard rises by 1.',
        Garrison: 'Garrison break the Siege Ward: its hazard drops by 1, and Garrison escorts become available for Act 4.',
        Ecologist: 'Ecologists map the Epicenter: artifact searches there get +2, and Ecologist outposts sell Anomaly Maps.',
    }[f];
    if (f === 'Sentinels' || f === 'Liberators') { w.goalDone.Barracks = true; w.barracks = f; log(`GOAL COMPLETE: ${f} take Vanguard Barracks. The Command Post (and Sergeant Kade) is theirs for good.`, 'gold'); }

}

    w.emission--;

// Rumors are drawn from real world state (file 10, Section 4).
function genRumors(n) {
    const w = S.w, pool = [];

    for (const z in ZONES) { const Z = ZONES[z]; if (Z.sub && w.visited.includes(z) && !w.found.includes(Z.sub)) pool.push(`There's a hidden way into ${Z.sub} somewhere in ${z}. Sharp eyes needed (Perception DC ${Z.subDC}).`); }
    for (const id in ARCS) if (!arcStage(id) && OUTPOSTS[id] && w.visited.includes(OUTPOSTS[id].zone)) pool.push(`${ARCS[id].npc} in ${OUTPOSTS[id].zone} is looking for someone reliable.`);
    if (w.migration && w.day <= w.migration.until) pool.push(`Mutants are migrating through ${w.migration.zone}.`);
    if (!w.story.alpha) pool.push({ t: 'An old scientist swore there is a sealed lab under the Industrial Basin loading dock, from before the Zone.', lore: 'alpha' });
    else if (!w.story.beta && w.story.betaDrive) pool.push({ t: 'Dr. Osei at the Dried Lake can decode almost anything. So can a sharp mind at a lab terminal.', lore: 'osei' });
    else if (w.story.beta && !w.story.gamma) pool.push({ t: 'Obelisk dig around a dead broadcast van at the edge of the Antenna Grid.', lore: 'gamma' });
    if (!w.terms.lucifer) pool.push('Something sleeps in the sealed crypt under the Siege Ward, and something guards it.');
    if (!w.terms.oasis) pool.push('Expeditions say an artifact beats like a heart beside The Wound in the Epicenter.');
    if (w.zone !== 'The Perimeter') pool.push('Raiders who lose a fight to you remember it. So do the ones you let walk.');

function gridHTML() {
    const reach = myTurn() && !C.pending && !S.p.st.prone ? dijkstra(C.px, C.py, playerPass, playerCost) : null;
    let h = '<div class="grid">';
    for (let y = 0; y < C.H; y++) {
        h += '<div class="grow">';
        for (let x = 0; x < C.W; x++) {
            let ch = C.map[y][x], cls = TILE_CLS[ch] || (ch === '.' ? 'c-floor' : '');
            const a = C.anoms[k(x, y)];
            if (a && a.revealed) { ch = '!'; cls = 'c-anom' + (a.searched ? ' c-dim' : ''); }
            const ob = C.objs[k(x, y)]; if (ob && !ob.done && ob.type !== 'R') { ch = ob.type === 'Q' ? '?' : ob.type; cls = ob.type === 'Q' ? 'c-quest' : 'c-term'; }
            if (smokeAt(x, y)) cls += ' c-smoke';
            const ui = C.units.findIndex(u => onMap(u) && u.x === x && u.y === y);
            if (x === C.px && y === C.py) { ch = '@'; cls = 'c-player'; }
            else if (ui >= 0 && visible(C.units[ui])) {
                const u = C.units[ui]; ch = String(ui + 1);
                cls = u.surrendered ? 'c-dim' : u.kind === 'human' ? 'c-human' : 'c-mutant';
                if (u.id === C.target) cls += ' c-target';
            } else if (reach) { const dd = reach.dist[y * C.W + x]; if ((x !== C.px || y !== C.py) && dd <= C.mp + coverMpFor(x, y)) cls += ' c-reach'; }
            h += `<span class="cell ${cls}" data-x="${x}" data-y="${y}">${ch}</span>`;
        }
        h += '</div>';
    }
    return h + '</div>';
}

function afterAction() { if (mode === 'combat' && C) checkClear(); render(); }
document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (b) { if (b.disabled) return; const f = H[+b.dataset.a]; if (f) { freshLog(); f(); afterAction(); } return; }
    const cell = e.target.closest('.cell');
    if (cell && mode === 'combat') { freshLog(); gridClick(+cell.dataset.x, +cell.dataset.y); afterAction(); }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && WORK) { document.body.classList.toggle('hide'); return; }
    if (mode !== 'combat' || e.target.tagName === 'INPUT') return;
    const key = e.key.toLowerCase();
    const mv = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] }[key];
    freshLog();
    if (mv) { e.preventDefault(); stepPlayer(...mv); }
    else if (key === 'e') endTurn();
    else if (key === 'f') playerAttack(false);
    else if (key === 'b' && eqWD() && burstOf(eqWD())) playerAttack(true);
    else if (key === 'r') reload();
    else return;
    afterAction();
});

// ===================== HEARTBEAT (real-time, out of combat) =====================
setInterval(() => {
    tick++;
    if (mode !== 'world') return;
    const c = S.c, p = S.p, d0 = D();
    let dirty = false;
    if (tick % 2 === 0 && c.area < 100) c.area++;
    if (c.fire > 0 && tick % 90 === 0) { c.fire--; log(c.fire ? `The fire is ${FIRE[c.fire]}.` : 'The fire has gone out.'); dirty = true; }
    if (tick % 10 === 0) {
        if (d0.regen && p.hp < d0.maxHp) { p.hp = Math.min(d0.maxHp, p.hp + d0.regen); dirty = true; }
        if ((p.st.bleed || p.st.toxic) && !d0.noBleed && d0.bleedDmg > 0) { p.hp -= d0.bleedDmg; log(`You are bleeding (−${d0.bleedDmg} HP). Use a Bandage.`, 'alert'); dirty = true; }
        if (p.st.rad) { p.hp -= 1; dirty = true; }
        if (p.hp <= 0) { die(); render(); return; }
    }
    if (tick % 30 === 0) saveGame(true);
    if (dirty) render();
}, 1000);

// ===================== BOOT =====================
S = freshState();
let hasSave = false;
try { hasSave = !!localStorage.getItem(SAVE_KEY); } catch (e) { /* storage blocked */ }
if (!(hasSave && loadGame())) { mode = 'create'; render(); }
setWork(WORK);
if (LANG === 'pt') setLang('pt');
</script>
